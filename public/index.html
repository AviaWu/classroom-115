<body>
<div class="bg" id="userBg"></div>

<header>
<h1>We are 5 甲</h1>
<div>
<button onclick="openBackend()">老師後台</button>
<button onclick="save()">儲存</button>
<span class="small" id="saveStatus"></span>
</div>
</header>

<div class="wrap">
<div id="students" class="grid"></div>
</div>

<div id="modal" class="modal">
<div class="panel">
<button class="close" onclick="closeModal()">關閉</button>
<div id="body"></div>

<script>
const STORAGE_KEY = "growth26_v18_full";
const MAX_IMG_SIZE = 800;
const IMG_QUALITY = 0.7;
const STORAGE_LIMIT = 5 * 1024 * 1024;
const DEFAULT_PRICE = 50;

let raw = localStorage.getItem(STORAGE_KEY);
let state = raw ? JSON.parse(raw) : null;
let unsavedChange = false;
let autoSaveTimer = null;
let lastShopTab = "clothes"; //記錄商店頁籤

if(!state){
    state = {
        students: Array.from({length:26}, (_,i)=>({
            id:i+1, gender: i<12 ? "M" : "F",
            tokens:0, doneTasks:[],
            ownedClothes:[], equippedClothes:null,
            ownedLayout:[], equippedLayout:[],
            ownedBg:[], equippedBg:null
        })),
        tasks: [
            {id:"t1", title:"完成今日作業", reward:20},
            {id:"t2", title:"完成數學練習", reward:30},
            {id:"t3", title:"幫助同學一次", reward:40}
        ],
        clothesM:[],
        clothesF:[],
        layouts:[],
        backgrounds:[],
        globalBgImage:"",
        lastSaved:null
    };
}else{
    if(!state.clothesM) state.clothesM=[];
    if(!state.clothesF) state.clothesF=[];
    if(!Array.isArray(state.layouts)) state.layouts=[];
    if(!Array.isArray(state.backgrounds)) state.backgrounds=[];
    if(!state.tasks) state.tasks = [];
    state.students.forEach(s=>{
        if(!s.gender) s.gender = s.id<=12?"M":"F";
        if(!Array.isArray(s.equippedLayout)) s.equippedLayout = [];
        if(!Array.isArray(s.ownedClothes)) s.ownedClothes = [];
        if(!Array.isArray(s.ownedLayout)) s.ownedLayout = [];
        if(!Array.isArray(s.ownedBg)) s.ownedBg = [];
        if(!Array.isArray(s.doneTasks)) s.doneTasks = [];
    });
}

function markChanged(){
    unsavedChange = true;
    document.getElementById("saveStatus").textContent = "⚠️有未儲存變更";
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(()=>{ save(); },5000);
}

window.addEventListener("beforeunload", e=>{
    if(unsavedChange){
        e.preventDefault();
        e.returnValue = "尚有未儲存的資料！建議先儲存再離開。";
        return e.returnValue;
    }
});

function makeItemId(){
    return "item_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
}
function makeTaskId(){
    return "t_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);
}

async function compressImage(file, maxSize, quality){
    return new Promise((resolve,reject)=>{
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = ()=>{
            URL.revokeObjectURL(url);
            let w = img.width, h = img.height;
            if(w>maxSize || h>maxSize){
                const scale = maxSize / Math.max(w,h);
                w = Math.round(w*scale);
                h = Math.round(h*scale);
            }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0,0,w,h);
            ctx.drawImage(img,0,0,w,h);
            if(file.type==="image/png" || file.name.toLowerCase().endsWith(".png")){
                resolve(canvas.toDataURL("image/png"));
            }else{
                resolve(canvas.toDataURL("image/jpeg", quality));
            }
        };
        img.onerror = ()=>{
            URL.revokeObjectURL(url);
            reject(new Error("圖片解碼失敗"));
        };
        img.src = url;
    });
}

function getStorageUsage(){
    const json = JSON.stringify(state);
    return new Blob([json]).size;
}

function save(){
    try{
        state.lastSaved = new Date().toLocaleString();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        unsavedChange = false;
        document.getElementById("saveStatus").textContent = "✅已儲存";
        return true;
    }catch(e){
        if(e.name === "QuotaExceededError"){
            alert("⚠️ 儲存空間已滿！無法儲存新項目。\n請刪除一些舊商品或匯出備份後重置。");
        }else{
            alert("儲存失敗："+e.message);
        }
        return false;
    }
}

function esc(x){
    return String(x).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function applyGlobalBg(){
    const el = document.getElementById("userBg");
    if(state.globalBgImage){
        el.style.backgroundImage = `url(${esc(state.globalBgImage)})`;
    }else{
        el.style.backgroundImage = "";
    }
}

function render(){
    const html = state.students.map(s=>{
        const eqBg = state.backgrounds.find(x=>x.id===s.equippedBg);
        const clothPool = s.gender==="M" ? state.clothesM : state.clothesF;
        const eqCloth = clothPool.find(x=>x.id===s.equippedClothes);
        const activeLayouts = state.layouts.filter(x=>s.equippedLayout.includes(x.id));

        let bgHtml = eqBg ? `<div class="bg-layer" style="background-image:url('${esc(eqBg.image)}')"></div>` : "";
        let charHtml;
        if(eqCloth?.image){
            charHtml = `<div class="character" style="background-image:url('${esc(eqCloth.image)}')"></div>`;
        }else{
            charHtml = s.gender==="M" ? "👦" : "👧";
        }
        const layHtml = activeLayouts.map((p,i)=>
            `<div class="layout-item" style="z-index:${3+i};background-image:url('${esc(p.image)}')"></div>`
        ).join("");

        return `<div class="card">
            <div class="avatar">${bgHtml}${charHtml}${layHtml}</div>
            <div>
                <span class="num">${s.id}號 ${s.gender==="M"?"♂":"♀"}</span>
                <span class="tokens">🪙 ${s.tokens}</span>
            </div>
            <div class="actions">
                <button onclick="tasks(${s.id})">任務</button>
                <button onclick="shop(${s.id})">商店</button>
                <button onclick="closet(${s.id})">衣櫃</button>
            </div>
        </div>`;
    }).join("");
    document.getElementById("students").innerHTML = html;
    applyGlobalBg();
}

function openModal(content){
    document.getElementById("body").innerHTML = content||"";
    document.getElementById("modal").classList.add("open");
}

function closeModal(){
    document.getElementById("body").innerHTML = "";
    document.getElementById("modal").classList.remove("open");
}

//學生端任務
function tasks(id){
    const s = state.students[id-1];
    const todo = state.tasks.filter(t=>!s.doneTasks.includes(t.id));
    openModal(`
        <h2>${id}號｜任務</h2>
        ${todo.length ? todo.map(t=>`
        <div class="row">
            <div class="grow"><b>${esc(t.title)}</b><div class="small">完成可獲得 ${t.reward} 代幣</div></div>
            <button class="primary" onclick="finishTask(${id},'${esc(t.id)}')">完成</button>
        </div>`).join("") : `<div class="empty">🎉 全部任務已完成！</div>`}
    `);
}
function finishTask(id,tid){
    const s = state.students[id-1];
    const t = state.tasks.find(x=>x.id===tid);
    if(!t || s.doneTasks.includes(tid)) return;
    s.doneTasks.push(tid);
    s.tokens += t.reward;
    markChanged(); save();render();tasks(id);
}

//商店
function clothCard(id,p){
    const s = state.students[id-1];
    const own = s.ownedClothes.includes(p.id);
    return `<div class="product">
        <div class="pic">${p.image?`<img src="${esc(p.image)}" alt="">`:"👗"}</div>
        <b>${esc(p.name)}</b>
        <div class="price">🪙 ${p.price}</div>
        <div class="owned">${own?"✓已擁有":`<button onclick="buyCloth(${id},'${esc(p.id)}')">購買</button>`}</div>
    </div>`;
}
function layCard(id,p){
    const s = state.students[id-1];
    const own = s.ownedLayout.includes(p.id);
    return `<div class="product">
        <div class="pic">${p.image?`<img src="${esc(p.image)}" alt="">`:"✨"}</div>
        <b>${esc(p.name)}</b>
        <div class="price">🪙 ${p.price}</div>
        <div class="owned">${own?"✓已擁有":`<button onclick="buyLayout(${id},'${esc(p.id)}')">購買</button>`}</div>
    </div>`;
}
function bgCard(id,p){
    const s = state.students[id-1];
    const own = s.ownedBg.includes(p.id);
    return `<div class="product">
        <div class="pic">${p.image?`<img src="${esc(p.image)}" alt="">`:"🖼"}</div>
        <b>${esc(p.name)}</b>
        <div class="price">🪙 ${p.price}</div>
        <div class="owned">${own?"✓已擁有":`<button onclick="buyBg(${id},'${esc(p.id)}')">購買</button>`}</div>
    </div>`;
}

function shop(id){
    openModal(`<h2>${id}號｜商店</h2>
    <div class="tabs">
        <button class="tab" onclick="switchShopTab(${id},'clothes')">服裝</button>
        <button class="tab" onclick="switchShopTab(${id},'layouts')">佈置</button>
        <button class="tab" onclick="switchShopTab(${id},'bgs')">背景</button>
    </div>
    <div id="shopTabContent"></div>`);
    switchShopTab(id, lastShopTab);
}
function switchShopTab(id,tab){
    lastShopTab = tab;
    const s = state.students[id-1];
    const clothPool = s.gender==="M"?state.clothesM:state.clothesF;
    let html="";
    if(tab==="clothes") html=`<div class="shopgrid">${clothPool.map(p=>clothCard(id,p)).join("")||`<div class="empty">尚無服裝</div>`}</div>`;
    if(tab==="layouts") html=`<div class="shopgrid">${state.layouts.map(p=>layCard(id,p)).join("")||`<div class="empty">尚無佈置</div>`}</div>`;
    if(tab==="bgs") html=`<div class="shopgrid">${state.backgrounds.map(p=>bgCard(id,p)).join("")||`<div class="empty">尚無背景</div>`}</div>`;
    document.getElementById("shopTabContent").innerHTML = html;
    document.querySelectorAll(".tab").forEach((el,i)=>{
        el.classList.toggle("active", ["clothes","layouts","bgs"][i]===tab);
    });
}

function buyCloth(id,pid){
    const s = state.students[id-1];
    const pool = s.gender==="M"?state.clothesM:state.clothesF;
    const item = pool.find(x=>x.id===pid);
    if(!item || s.ownedClothes.includes(pid)) return;
    if(s.tokens < item.price){ alert("代幣不足！"); return; }
    s.tokens -= item.price; s.ownedClothes.push(pid);
    markChanged(); save(); render(); switchShopTab(id, lastShopTab);
}
function buyLayout(id,pid){
    const s = state.students[id-1];
    const item = state.layouts.find(x=>x.id===pid);
    if(!item || s.ownedLayout.includes(pid)) return;
    if(s.tokens < item.price){ alert("代幣不足！"); return; }
    s.tokens -= item.price; s.ownedLayout.push(pid);
    markChanged(); save(); render(); switchShopTab(id, lastShopTab);
}
function buyBg(id,pid){
    const s = state.students[id-1];
    const item = state.backgrounds.find(x=>x.id===pid);
    if(!item || s.ownedBg.includes(pid)) return;
    if(s.tokens < item.price){ alert("代幣不足！"); return; }
    s.tokens -= item.price; s.ownedBg.push(pid);
    markChanged(); save(); render(); switchShopTab(id, lastShopTab);
}

//衣櫃
function closet(id){
    openModal(`<h2>${id}號｜衣櫃</h2>
    <div class="tabs">
        <button class="tab active" onclick="switchClosetTab(${id},'clothes')">服裝</button>
        <button class="tab" onclick="switchClosetTab(${id},'layouts')">佈置</button>
        <button class="tab" onclick="switchClosetTab(${id},'bgs')">背景</button>
    </div>
    <div id="closetTabContent"></div>`);
    switchClosetTab(id,"clothes");
}
function switchClosetTab(id,tab){
    const s = state.students[id-1];
    const clothPool = s.gender==="M"?state.clothesM:state.clothesF;
    let html="";
    if(tab==="clothes"){
        const list = clothPool.filter(x=>s.ownedClothes.includes(x.id));
        html = `<div class="shopgrid">${list.map(p=>`<div class="product">
            <div class="pic">${p.image?`<img src="${esc(p.image)}">`:"👗"}</div>
            <b>${esc(p.name)}</b>
            <div><button onclick="equipClothes(${id},'${esc(p.id)}')">${s.equippedClothes===p.id?"脫下":"穿上"}</button></div>
        </div>`).join("")||`<div class="empty">還沒有服裝</div>`}</div>`;
    }
    if(tab==="layouts"){
        const list = state.layouts.filter(x=>s.ownedLayout.includes(x.id));
        html = `<div class="shopgrid">${list.map(p=>`<div class="product">
            <div class="pic">${p.image?`<img src="${esc(p.image)}">`:"✨"}</div>
            <b>${esc(p.name)}</b>
            <div><button onclick="toggleEquipLayout(${id},'${esc(p.id)}')">${s.equippedLayout.includes(p.id)?"卸下":"配戴"}</button></div>
        </div>`).join("")||`<div class="empty">還沒有佈置</div>`}</div>`;
    }
    if(tab==="bgs"){
        const list = state.backgrounds.filter(x=>s.ownedBg.includes(x.id));
        html = `<div class="shopgrid">${list.map(p=>`<div class="product">
            <div class="pic">${p.image?`<img src="${esc(p.image)}">`:"🖼"}</div>
            <b>${esc(p.name)}</b>
            <div><button onclick="equipBg(${id},'${esc(p.id)}')">${s.equippedBg===p.id?"移除":"設為背景"}</button></div>
        </div>`).join("")||`<div class="empty">還沒有背景</div>`}</div>`;
    }
    document.getElementById("closetTabContent").innerHTML = html;
    document.querySelectorAll(".tab").forEach((el,i)=>{
        el.classList.toggle("active", ["clothes","layouts","bgs"][i]===tab);
    });
}
function equipClothes(id,pid){
    const s = state.students[id-1];
    s.equippedClothes = (s.equippedClothes===pid) ? null : pid;
    markChanged(); save();render();closet(id);
}
function toggleEquipLayout(id,pid){
    const s = state.students[id-1];
    const arr = s.equippedLayout;
    if(arr.includes(pid)){
        s.equippedLayout = arr.filter(x=>x!==pid);
    }else{
        s.equippedLayout.push(pid);
    }
    markChanged(); save();render();closet(id);
}
function equipBg(id,pid){
    const s = state.students[id-1];
    s.equippedBg = (s.equippedBg===pid) ? null : pid;
    markChanged(); save();render();closet(id);
}

//後台
openBackend = function(){
    openModal(`
    <h2>登入後台</h2>
    <div class="row">
        <label>管理密碼：</label>
        <input type="password" id="backendPw">
    </div>
    <div class="row">
        <button class="primary" onclick="checkBackendPw()">登入</button>
        <button onclick="closeModal()">取消</button>
    </div>
    `);
}
async function checkBackendPw(){
    const pw = document.getElementById("backendPw").value;
    if(pw === "1127"){
        closeModal();
        await backend();
    }else{
        alert("密碼錯誤！");
        closeModal();
    }
}

async function backend(){
    const used = getStorageUsage();
    const usedMb = (used/1024/1024).toFixed(2);
    const full = used > STORAGE_LIMIT * 0.9;

    //任務統計
    let taskListHtml = state.tasks.map(t=>{
        const doneStudents = state.students.filter(s=>s.doneTasks.includes(t.id));

//【危險功能：清空記憶體 / 重置遊戲】
function wipeStorage(){
    if(!confirm("⚠️ 第一次確認：將刪除五年甲班換裝遊戲所有本機儲存！\n資料會消失！建議先匯出備份！")) return;
    if(!confirm("🔥 第二次確認！真的要全部刪除嗎？無法復原！")) return;
    localStorage.removeItem(STORAGE_KEY);
    alert("已刪除儲存！頁面即將重新載入");
    location.reload();
}
function resetGame(){
    if(!confirm("⚠️ 第一次確認：重置回遊戲預設初始狀態，自訂服裝、代幣全部清空！")) return;
    if(!confirm("🔥 第二次確認！確定重置？")) return;
    localStorage.removeItem(STORAGE_KEY);
    state = null;
    raw = null;
    state = {
        students: Array.from({length:26}, (_,i)=>({
            id:i+1, gender: i<12 ? "M" : "F",
            tokens:0, doneTasks:[],
            ownedClothes:[], equippedClothes:null,
            ownedLayout:[], equippedLayout:[],
            ownedBg:[], equippedBg:null
        })),
        tasks: [
            {id:"t1", title:"完成今日作業", reward:20},
            {id:"t2", title:"完成數學練習", reward:30},
            {id:"t3", title:"幫助同學一次", reward:40}
        ],
        clothesM:[], clothesF:[], layouts:[], backgrounds:[],
        globalBgImage:"", lastSaved:null
    };
    save();
    render();
    closeModal();
    alert("已重置回遊戲初始狀態！");
}

//修改商品名稱、價格
function updateItemName(listName,id,newName){
    const item = state[listName].find(x=>x.id===id);
    if(!item) return;
    item.name = newName.trim()||"未命名";
    markChanged(); save(); backend();
}
function updateItemPrice(listName,id,newPrice){
    const item = state[listName].find(x=>x.id===id);
    if(!item || isNaN(newPrice) || newPrice<0) return;
    item.price = newPrice;
    markChanged(); save(); backend();
}

//批量新增工具函式
async function batchUploadFiles(fileList, targetArray, prefixName){
    for(let i=0;i<fileList.length;i++){
        const file = fileList[i];
        const imgData = await compressImage(file, MAX_IMG_SIZE, IMG_QUALITY);
        targetArray.push({
            id: makeItemId(),
            name: `${prefixName} ${i+1}`,
            price: DEFAULT_PRICE,
            image: imgData
        });
    }
    markChanged(); save(); backend();
}

async function batchAddClothM(){
    const files = document.getElementById("mImgBatch").files;
    if(!files.length) return alert("請選擇圖片");
    await batchUploadFiles(files, state.clothesM, "男生服裝");
}
async function batchAddClothF(){
    const files = document.getElementById("fImgBatch").files;
    if(!files.length) return alert("請選擇圖片");
    await batchUploadFiles(files, state.clothesF, "女生服裝");
}
async function batchAddLayout(){
    const files = document.getElementById("layImgBatch").files;
    if(!files.length) return alert("請選擇圖片");
    await batchUploadFiles(files, state.layouts, "佈置");
}
async function batchAddBg(){
    const files = document.getElementById("bgImgBatch").files;
    if(!files.length) return alert("請選擇圖片");
    await batchUploadFiles(files, state.backgrounds, "背景");
}

//任務
function addTask(){
    const title = document.getElementById("newTaskTitle").value.trim();
    const reward = Number(document.getElementById("newTaskReward").value)||0;
    if(!title){alert("請輸入任務名稱");return;}
    state.tasks.push({
        id: makeTaskId(),
        title: title,
        reward: reward
    });
    markChanged(); save(); backend();
}
function deleteTask(tid){
    if(!confirm("確定刪除這個任務？已完成紀錄會一併失效。")) return;
    state.tasks = state.tasks.filter(t=>t.id!==tid);
    markChanged(); save(); backend();
}

//學生
function editToken(id){
    const s = state.students[id-1];
    const val = prompt(`覆蓋設定${id}號代幣，現在：${s.tokens}`, s.tokens);
    if(val===null) return;
    const n = Number(val);
    if(isNaN(n)) return alert("請輸入數字");
    s.tokens = n;
    markChanged(); save(); render(); backend();
}
function addTokenOne(){
    const sid = Number(document.getElementById("targetStuId").value);
    const delta = Number(document.getElementById("deltaToken").value);
    if(!sid || sid<1 || sid>state.students.length || isNaN(delta)) return alert("輸入不正確");
    state.students[sid-1].tokens += delta;
    markChanged(); save(); render(); backend();
}
function subTokenOne(){
    const sid = Number(document.getElementById("targetStuId").value);
    const delta = Number(document.getElementById("deltaToken").value);
    if(!sid || sid<1 || sid>state.students.length || isNaN(delta)) return alert("輸入不正確");
    state.students[sid-1].tokens -= delta;
    markChanged(); save(); render(); backend();
}

function resizeStudentList(){
    const n = Number(document.getElementById("stuCount").value);
    if(!n || n<1) return;
    if(n>state.students.length){
        for(let i=state.students.length;i<n;i++){
            state.students.push({
                id:i+1, gender:i%2===0?"M":"F",
                tokens:0, doneTasks:[],
                ownedClothes:[], equippedClothes:null,
                ownedLayout:[], equippedLayout:[],
                ownedBg:[], equippedBg:null
            });
        }
    }else{
        state.students.splice(n);
    }
    markChanged(); save(); render(); backend();
}
function addTokenAll(){
    const v = Number(document.getElementById("batchToken").value)||0;
    state.students.forEach(s=>s.tokens+=v);
    markChanged(); save(); render(); backend();
}
function setTokenAll(){
    const v = Number(document.getElementById("batchToken").value)||0;
    state.students.forEach(s=>s.tokens=v);
    markChanged(); save(); render(); backend();
}

//全域背景
async function setGlobalBg(){
    const file = document.getElementById("globalBgFile").files[0];
    if(!file) return;
    state.globalBgImage = await compressImage(file,MAX_IMG_SIZE,IMG_QUALITY);
    markChanged(); save(); applyGlobalBg(); backend();

    state.globalBgImage = "";
    markChanged(); save(); applyGlobalBg(); backend();

//備份匯入匯出
function exportData(){
    const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `五年甲班換裝遊戲_備份_${new Date().toLocaleDateString()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
}
async function importData(input){
    const f = input.files[0];
    if(!f) return;
    const txt = await f.text();
    try{
        const newState = JSON.parse(txt);
        if(!newState.students) throw new Error("檔案不是有效的備份");
        if(!confirm("⚠️ 將覆蓋目前所有資料！建議先匯出備份！確定嗎？")) return;
        state = newState;
        markChanged(); save(); render(); backend();
        alert("匯入成功！");
    }catch(e){
        alert("匯入失敗："+e.message);
    }
}
