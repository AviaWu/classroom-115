<script>
const STORAGE_KEY = "growth26_v18_full";
const MAX_IMG_SIZE = 800;
const IMG_QUALITY = 0.7;
const STORAGE_LIMIT = 5 * 1024 * 1024;
const DEFAULT_PRICE = 50;
const BUILTIN_MONSTERS = [
    {name:"怪獸 1", image:"/images/mon/m%20(1).jpg"},
    {name:"怪獸 2", image:"/images/mon/m%20(2).jpg"},
    {name:"怪獸 3", image:"/images/mon/m%20(3).jpg"},
    {name:"怪獸 4", image:"/images/mon/m%20(4).jpg"}
];

let raw = localStorage.getItem(STORAGE_KEY);
const sharedState = readSharedState();
if(sharedState){
    raw = JSON.stringify(sharedState);
    localStorage.setItem(STORAGE_KEY, raw);
}
let state = raw ? JSON.parse(raw) : null;
let unsavedChange = false;
let autoSaveTimer = null;
let lastShopTab = "clothes"; //記錄商店頁籤

if(!state){
    state = {
        students: Array.from({length:26}, (_,i)=>({
            id:i+1, gender: i<12 ? "M" : "F",
            tokens:0, doneTasks:[],
            ownedClothes:[], equippedClothes:null,
            ownedLayout:[], equippedLayout:[],
            ownedBg:[], equippedBg:null
        })),
        tasks: [
            {id:"t1", title:"完成今日作業", reward:20},
            {id:"t2", title:"完成數學練習", reward:30},
            {id:"t3", title:"幫助同學一次", reward:40}
        ],
        clothesM:[],
        clothesF:[],
        layouts:[],
        backgrounds:[],
        coopTasks:[],
        globalBgImage:"",
        lastSaved:null
    };
}else{
    if(!state.clothesM) state.clothesM=[];
    if(!state.clothesF) state.clothesF=[];
    if(!Array.isArray(state.layouts)) state.layouts=[];
    if(!Array.isArray(state.backgrounds)) state.backgrounds=[];
    if(!Array.isArray(state.coopTasks)) state.coopTasks=[];
    if(!state.tasks) state.tasks = [];
    state.students.forEach(s=>{
        if(!s.gender) s.gender = s.id<=12?"M":"F";
        if(!Array.isArray(s.equippedLayout)) s.equippedLayout = [];
        if(!Array.isArray(s.ownedClothes)) s.ownedClothes = [];
        if(!Array.isArray(s.ownedLayout)) s.ownedLayout = [];
        if(!Array.isArray(s.ownedBg)) s.ownedBg = [];
        if(!Array.isArray(s.doneTasks)) s.doneTasks = [];
    });
}

function readSharedState(){
    const prefix = "#game=";
    if(!location.hash.startsWith(prefix)) return null;
    try{
        const data = JSON.parse(decodeURIComponent(location.hash.slice(prefix.length)));
        history.replaceState(null,"",location.pathname+location.search);
        return data;
    }catch(error){
        console.warn("分享資料無法讀取", error);
        return null;
    }
}

async function shareGame(){
    try{
        save();
        const encoded = encodeURIComponent(JSON.stringify(state));
        const url = `${location.origin}${location.pathname}#game=${encoded}`;
        const shareData = {title:"班級換裝遊戲",text:"一起加入班級換裝遊戲！",url};
        const canUseNativeShare = typeof navigator.share === "function" &&
            window.isSecureContext && location.protocol !== "file:";

        if(canUseNativeShare){
            try{
                await navigator.share(shareData);
                return;
            }catch(error){
                if(error.name === "AbortError") return;
                console.warn("原生分享被拒絕，改用複製連結",error);
            }
        }

        if(navigator.clipboard && window.isSecureContext){
            await navigator.clipboard.writeText(url);
            alert("原生分享未獲得瀏覽器許可，分享連結已複製！");
            return;
        }

        const copyBox = document.createElement("textarea");
        copyBox.value = url;
        copyBox.style.position = "fixed";
        copyBox.style.opacity = "0";
        document.body.appendChild(copyBox);
        copyBox.select();
        document.execCommand("copy");
        copyBox.remove();
        alert("分享連結已複製，請貼到通訊軟體分享。");
    }catch(error){
        console.error("分享失敗",error);
        alert(`分享失敗：${error.message||"請改用複製連結"}`);
    }
}

async function compressImage(file, maxSize, quality){
    return new Promise((resolve,reject)=>{
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = ()=>{
            URL.revokeObjectURL(url);
            let w = img.width, h = img.height;
            if(w>maxSize || h>maxSize){
                const scale = maxSize / Math.max(w,h);
                w = Math.round(w*scale);
                h = Math.round(h*scale);
            }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0,0,w,h);
            ctx.drawImage(img,0,0,w,h);
            if(file.type==="image/png" || file.name.toLowerCase().endsWith(".png")){
                resolve(canvas.toDataURL("image/png"));
            }else{
                resolve(canvas.toDataURL("image/jpeg", quality));
            }
        };
        img.onerror = ()=>{
            URL.revokeObjectURL(url);
            reject(new Error("圖片解碼失敗"));
        };
        img.src = url;
    });
}

function openCoopTasks(selectedId){
    const active = state.coopTasks.filter(t=>!t.claimed);
    if(!active.length){
        openModal(`<h2>協力任務</h2><div class="empty">目前沒有進行中的協力任務。</div>`);
        return;
    }
    const taskId = active.some(t=>t.id===selectedId) ? selectedId : active[0].id;
    const taskButtons = active.map(t=>`<button class="${t.id===taskId?"active":""}" onclick="openCoopTasks('${esc(t.id)}')">${esc(t.monsterName)}</button>`).join("");
    openCoopTask(taskId, taskButtons);
}
function openCoopTask(taskId, taskButtons=""){
    const task = state.coopTasks.find(t=>t.id===taskId);
    if(!task) return openCoopTasks();
    const completed = Array.isArray(task.completedBy) ? task.completedBy : [];
    const hpPercent = Math.max(0, Math.round((state.students.length-completed.length) / state.students.length * 100));
    const members = state.students.map(s=>{
        const done = completed.includes(s.id);
        const pool = s.gender==="M" ? state.clothesM : state.clothesF;
        const equipped = pool.find(x=>x.id===s.equippedClothes);
        const eqBg = state.backgrounds.find(x=>x.id===s.equippedBg);
        const activeLayouts = state.layouts.filter(x=>s.equippedLayout.includes(x.id));
        const image = equipped?.image || (s.gender==="M" ? "/images/boy/b0.png" : "/images/girl/g0.png");
        const bgImage = eqBg?.image || "";
        const bgHtml = bgImage ? `<div class="bg-layer" style="background-image:url('${esc(bgImage)}')"></div>` : "";
        const layoutHtml = activeLayouts.map((item,index)=>
            `<div class="layout-item" style="z-index:${3+index};background-image:url('${esc(item.image)}')"></div>`
        ).join("");
        return `<button class="coop-member ${done?"done":""}" ${done?"disabled":""} onclick="completeCoopMember('${esc(task.id)}',${s.id})">
            <div class="coop-avatar"><div class="avatar">${bgHtml}<div class="character" style="background-image:url('${esc(image)}')"></div>${layoutHtml}</div></div>
            <span>${s.id}${done?" ✓":""}</span>
        </button>`;
    }).join("");
    openModal(`<h2>協力任務</h2>
        <div class="monster-list">${taskButtons}</div>
        <div class="coop-layout">
            <div class="coop-side coop-side-monster">
                <h3>${esc(task.monsterName)}</h3>
                <div id="coopMonsterVisual">${task.monsterImage?`<img src="${esc(task.monsterImage)}" alt="${esc(task.monsterName)}">`:"👾"}</div>
                <div class="coop-hp" aria-label="怪獸HP"><div class="coop-hp-fill" style="width:${hpPercent}%"></div></div>
                <b>HP ${state.students.length-completed.length} / ${state.students.length}</b>
                <div>${esc(task.content)}</div>
                <div class="small">全員完成後，每位成員獲得 🪙 ${task.reward}</div>
            </div>
            <div class="coop-side coop-side-members">
                <div class="coop-members">${members}</div>
            </div>
        </div>`);
}
function completeCoopMember(taskId,studentId){
    const task = state.coopTasks.find(t=>t.id===taskId);
    if(!task || task.claimed) return;
    if(!Array.isArray(task.completedBy)) task.completedBy=[];
    if(task.completedBy.includes(studentId)) return;
    task.completedBy.push(studentId);
    if(task.completedBy.length >= state.students.length){
        state.students.forEach(s=>s.tokens += Number(task.reward)||0);
        task.claimed = true;
        markChanged(); save(); render();
        alert(`恭喜同心協力打敗「${task.monsterName}」！每位成員獲得 ${task.reward} 代幣！`);
        openCoopTasks();
        return;
    }
    markChanged(); save();
    const active = state.coopTasks.filter(t=>!t.claimed);
    const taskButtons = active.map(t=>`<button class="${t.id===taskId?"active":""}" onclick="openCoopTasks('${esc(t.id)}')">${esc(t.monsterName)}</button>`).join("");
    openCoopTask(taskId, taskButtons);
    setTimeout(()=>document.getElementById("coopMonsterVisual")?.classList.add("coop-hit"),20);
}

//【危險功能：清空記憶體 / 重置遊戲】
function wipeStorage(){
    if(!confirm("⚠️ 第一次確認：將刪除五年甲班換裝遊戲所有本機儲存！\n資料會消失！建議先匯出備份！")) return;
    if(!confirm("🔥 第二次確認！真的要全部刪除嗎？無法復原！")) return;
    localStorage.removeItem(STORAGE_KEY);
    alert("已刪除儲存！頁面即將重新載入");
    location.reload();
}
function resetGame(){
    if(!confirm("⚠️ 第一次確認：重置回遊戲預設初始狀態，自訂服裝、代幣全部清空！")) return;
    if(!confirm("🔥 第二次確認！確定重置？")) return;
    localStorage.removeItem(STORAGE_KEY);
    state = null;
    raw = null;
    state = {
        students: Array.from({length:26}, (_,i)=>({
            id:i+1, gender: i<12 ? "M" : "F",
            tokens:0, doneTasks:[],
            ownedClothes:[], equippedClothes:null,
            ownedLayout:[], equippedLayout:[],
            ownedBg:[], equippedBg:null
        })),
        tasks: [
            {id:"t1", title:"完成今日作業", reward:20},
            {id:"t2", title:"完成數學練習", reward:30},
            {id:"t3", title:"幫助同學一次", reward:40}
        ],
        clothesM:[], clothesF:[], layouts:[], backgrounds:[], coopTasks:[],
        globalBgImage:"", lastSaved:null
    };
    save();
    render();
    closeModal();
    alert("已重置回遊戲初始狀態！");
}

//商品排序：調整陣列順序，商店會依此順序顯示
let draggedItem = null;
function dragItem(event,listName,id){
    draggedItem = {listName,id};
    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData("text/plain", id);
}
function dropItem(event,listName,targetId){
    event.preventDefault();
    if(!draggedItem || draggedItem.listName!==listName || draggedItem.id===targetId) return;
    const list = state[listName];
    const fromIndex = list.findIndex(item=>item.id===draggedItem.id);
    const toIndex = list.findIndex(item=>item.id===targetId);
    if(fromIndex<0 || toIndex<0) return;
    const [item] = list.splice(fromIndex,1);
    list.splice(toIndex,0,item);
    draggedItem = null;
    markChanged(); save(); backend();
}
function jumpBackend(targetId){
    document.querySelectorAll(".backend-page").forEach(page=>page.classList.remove("active"));
    const target = document.getElementById(targetId);
    if(target){
        target.classList.add("active");
        target.scrollIntoView({behavior:"smooth",block:"start"});
    }
}

function selectCoopMonster(button,image){
    const input = document.getElementById("coopMonsterImage");
    if(!input) return;
    input.value = image;
    document.querySelectorAll(".monster-choice").forEach(item=>item.classList.remove("active"));
    button.classList.add("active");
}

async function publishCoopTask(){
    const monsterName = document.getElementById("coopMonsterName").value.trim();
    const content = document.getElementById("coopContent").value.trim();
    const reward = Number(document.getElementById("coopReward").value);
    const monsterImage = document.getElementById("coopMonsterImage").value;
    if(!monsterName || !content || !Number.isFinite(reward) || reward<0) return alert("請完整填寫怪獸名稱、任務內容與獎勵");
    state.coopTasks.push({id:makeTaskId(),monsterName,content,reward,monsterImage,completedBy:[],claimed:false});
    markChanged(); save(); backend();
}
function deleteCoopTask(taskId){
    if(!confirm("確定刪除此協力任務？")) return;
    state.coopTasks = state.coopTasks.filter(t=>t.id!==taskId);
    markChanged(); save(); backend();
}

function moveItem(listName,id,direction){
    const list = state[listName];
    const index = list.findIndex(item=>item.id===id);
    const targetIndex = index + direction;
    if(index<0 || targetIndex<0 || targetIndex>=list.length) return;
    [list[index], list[targetIndex]] = [list[targetIndex], list[index]];
    markChanged(); save(); backend();
}

//修改商品名稱、價格
function updateItemName(listName,id,newName){
    const item = state[listName].find(x=>x.id===id);
    if(!item) return;
    item.name = newName.trim()||"未命名";
    markChanged(); save(); backend();
}
function updateItemPrice(listName,id,newPrice){
    const item = state[listName].find(x=>x.id===id);
    if(!item || isNaN(newPrice) || newPrice<0) return;
    item.price = newPrice;
    markChanged(); save(); backend();
}

//批量新增工具函式
async function batchUploadFiles(fileList, targetArray, prefixName){
    for(let i=0;i<fileList.length;i++){
        const file = fileList[i];
        const imgData = await compressImage(file, MAX_IMG_SIZE, IMG_QUALITY);
        targetArray.push({
            id: makeItemId(),
            name: `${prefixName} ${i+1}`,
            price: DEFAULT_PRICE,
            image: imgData
        });
    }
    markChanged(); save(); backend();
}

//任務
function addTask(){
    const title = document.getElementById("newTaskTitle").value.trim();
    const reward = Number(document.getElementById("newTaskReward").value)||0;
    const dueValue = document.getElementById("newTaskDueAt").value;
    const dueAt = dueValue ? new Date(dueValue).getTime() : null;
    if(!title){alert("請輸入任務名稱");return;}
    if(dueAt && dueAt<=Date.now()){alert("完成期限必須晚於現在");return;}
    state.tasks.push({
        id: makeTaskId(),
        title: title,
        reward: reward,
        dueAt: dueAt
    });
    markChanged(); save(); backend();
}
function deleteTask(tid){
    if(!confirm("確定刪除這個任務？已完成紀錄會一併失效。")) return;
    state.tasks = state.tasks.filter(t=>t.id!==tid);
    markChanged(); save(); backend();
}

//學生管理
function setStudentGender(id,gender){
    const s = state.students[id-1];
    if(!s || !["M","F"].includes(gender)) return;
    s.gender = gender;
    if(s.equippedClothes && !(gender==="M"?state.clothesM:state.clothesF).some(item=>item.id===s.equippedClothes)){
        s.equippedClothes = null;
    }
    markChanged(); save(); render(); backend();
}

function resetStudentCloset(id){
    const s = state.students[id-1];
    if(!s || !confirm(`確定重置${id}號的衣櫃嗎？已購買的服裝、佈置與背景都會清除，代幣不受影響。`)) return;
    s.ownedClothes = [];
    s.equippedClothes = null;
    s.ownedLayout = [];
    s.equippedLayout = [];
    s.ownedBg = [];
    s.equippedBg = null;
    markChanged(); save(); render(); backend();
}

function editToken(id){
    const s = state.students[id-1];
    const val = prompt(`覆蓋設定${id}號代幣，現在：${s.tokens}`, s.tokens);
    if(val===null) return;
    const n = Number(val);
    if(isNaN(n)) return alert("請輸入數字");
    s.tokens = n;
    markChanged(); save(); render(); backend();
}
function addTokenOne(){
    const sid = Number(document.getElementById("targetStuId").value);
    const delta = Number(document.getElementById("deltaToken").value);
    if(!sid || sid<1 || sid>state.students.length || isNaN(delta)) return alert("輸入不正確");
    state.students[sid-1].tokens += delta;
    markChanged(); save(); render(); backend();
}
function subTokenOne(){
    const sid = Number(document.getElementById("targetStuId").value);
    const delta = Number(document.getElementById("deltaToken").value);
    if(!sid || sid<1 || sid>state.students.length || isNaN(delta)) return alert("輸入不正確");
    state.students[sid-1].tokens -= delta;
    markChanged(); save(); render(); backend();
}

function resizeStudentList(){
    const n = Number(document.getElementById("stuCount").value);
    if(!n || n<1) return;
    if(n>state.students.length){
        for(let i=state.students.length;i<n;i++){
            state.students.push({
                id:i+1, gender:i%2===0?"M":"F",
                tokens:0, doneTasks:[],
                ownedClothes:[], equippedClothes:null,
                ownedLayout:[], equippedLayout:[],
                ownedBg:[], equippedBg:null
            });
        }
    }else{
        state.students.splice(n);
    }
    markChanged(); save(); render(); backend();
}
function addTokenAll(){
    const v = Number(document.getElementById("batchToken").value)||0;
    state.students.forEach(s=>s.tokens+=v);
    markChanged(); save(); render(); backend();
}
function setTokenAll(){
    const v = Number(document.getElementById("batchToken").value)||0;
    state.students.forEach(s=>s.tokens=v);
    markChanged(); save(); render(); backend();
}

    state.clothesF.push({id:makeItemId(),name,price,image:img});
    markChanged(); save(); backend();
}
async function addLayout(){
    const name = document.getElementById("layName").value.trim();
    const price = Number(document.getElementById("layPrice").value)||DEFAULT_PRICE;
    const file = document.getElementById("layImg").files[0];
    if(!name||!file){alert("請填名稱並選圖片");return;}
    const img = await compressImage(file,MAX_IMG_SIZE,IMG_QUALITY);
    state.layouts.push({id:makeItemId(),name,price,image:img});
    markChanged(); save(); backend();
}
async function addBgItem(){
    const name = document.getElementById("bgName").value.trim();
    const price = Number(document.getElementById("bgPrice").value)||DEFAULT_PRICE;
    const file = document.getElementById("bgImg").files[0];
    if(!name||!file){alert("請填名稱並選圖片");return;}

function deleteItem(listName,id){
    if(!confirm("刪除此商品！學生已經買走的不會被回收。")) return;
    state[listName] = state[listName].filter(x=>x.id!==id);
    markChanged(); save(); backend();
}

//全域背景
async function setGlobalBg(){
    const file = document.getElementById("globalBgFile").files[0];
    if(!file) return;
    state.globalBgImage = await compressImage(file,MAX_IMG_SIZE,IMG_QUALITY);
    markChanged(); save(); applyGlobalBg(); backend();
}
function clearGlobalBg(){
    state.globalBgImage = "";
    markChanged(); save(); applyGlobalBg(); backend();
}

//備份匯入匯出
function exportData(){
    const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `五年甲班換裝遊戲_備份_${new Date().toLocaleDateString()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
}
async function importData(input){
    const f = input.files[0];
    if(!f) return;
    const txt = await f.text();
    try{
        const newState = JSON.parse(txt);
        if(!newState.students) throw new Error("檔案不是有效的備份");
        if(!confirm("⚠️ 將覆蓋目前所有資料！建議先匯出備份！確定嗎？")) return;
        state = newState;
        markChanged(); save(); render(); backend();
        alert("匯入成功！");
    }catch(e){
        alert("匯入失敗："+e.message);
    }
}

//初始化
render();
