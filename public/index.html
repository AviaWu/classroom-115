    <style>
      /* 平面像素風 UI */
      :root{
        --pixel-ink:#20263a;
        --pixel-navy:#34405c;
        --pixel-paper:#f7e9c8;
        --pixel-cream:#fff5dc;
        --pixel-gold:#f3d98b;
        --pixel-blue:#9ed7d3;
        --pixel-pink:#efb1a5;
        --pixel-shadow:#172033;
      }
      html{background:#d8c69e}
      body{
        background:#d8c69e!important;
        color:var(--pixel-ink);
        font-family:"Courier New",monospace;
        image-rendering:pixelated;
      }
      body::before{
        content:"";
        position:fixed;
        inset:0;
        z-index:-2;
        opacity:.18;
        pointer-events:none;
        background-image:linear-gradient(45deg,rgba(32,38,58,.25) 25%,transparent 25%,transparent 75%,rgba(32,38,58,.25) 75%);
        background-size:8px 8px;
      }
      header{
        background:var(--pixel-navy)!important;
        border:0;
        border-bottom:6px solid var(--pixel-shadow);
        padding:14px 22px;
        box-shadow:0 5px 0 rgba(23,32,51,.35);
      }
      header h1{
        color:var(--pixel-gold)!important;
        font-size:clamp(18px,3vw,30px);
        letter-spacing:1px;
        text-shadow:3px 3px 0 var(--pixel-shadow);
      }
      h1,h2,h3{font-family:"Courier New",monospace;letter-spacing:.5px}
      h2,h3{color:var(--pixel-navy)}
      .wrap{padding:28px 20px}
      button{
        border:3px solid var(--pixel-ink);
        border-radius:0;
        background:var(--pixel-paper);
        color:var(--pixel-ink);
        box-shadow:4px 4px 0 var(--pixel-shadow);
        transition:transform .08s,box-shadow .08s;
      }

function normalizeState(target){
    if(!target || typeof target!=="object") return null;
    if(!Array.isArray(target.students)) target.students=[];
    target.students = target.students.filter(s=>s && typeof s==="object");
    if(!Array.isArray(target.clothesM)) target.clothesM=[];
    if(!Array.isArray(target.clothesF)) target.clothesF=[];
    if(!Array.isArray(target.layouts)) target.layouts=[];
    if(!Array.isArray(target.backgrounds)) target.backgrounds=[];
    if(!Array.isArray(target.coopTasks)) target.coopTasks=[];
    if(!Array.isArray(target.coopTaskTemplates)) target.coopTaskTemplates=[];
    if(!Array.isArray(target.drawings)) target.drawings=[];
    if(!Array.isArray(target.drawingAlbum)) target.drawingAlbum=[];
    target.drawings = target.drawings.filter(item=>item && typeof item.data==="string");
    target.drawingAlbum = target.drawingAlbum.filter(item=>item && typeof item.data==="string");
    if(target.drawings.length>3){
        target.drawingAlbum.unshift(...target.drawings.slice(3));
        target.drawings = target.drawings.slice(0,3);
    }
    if(!Array.isArray(target.tasks)) target.tasks=[];
    if(!Array.isArray(target.dailyTaskTemplates)) target.dailyTaskTemplates=[];
    target.dailyTaskTemplates = target.dailyTaskTemplates.filter(item=>item && typeof item==="object").map(item=>({
        ...item,
        enabled:item.enabled!==false,
        appearTime:/^\d{2}:\d{2}$/.test(item.appearTime||"") ? item.appearTime : "08:00",
        dueTime:/^\d{2}:\d{2}$/.test(item.dueTime||"") ? item.dueTime : "23:59"
    }));
    if(!Array.isArray(target.weeklyTaskTemplates)) target.weeklyTaskTemplates=[];
    target.weeklyTaskTemplates = target.weeklyTaskTemplates.filter(item=>item && typeof item==="object").map(item=>({
        ...item,
        enabled:item.enabled!==false,
        appearWeekday:Number.isInteger(Number(item.appearWeekday)) && Number(item.appearWeekday)>=0 && Number(item.appearWeekday)<=6 ? Number(item.appearWeekday) : 1,
        dueWeekday:Number.isInteger(Number(item.dueWeekday)) && Number(item.dueWeekday)>=0 && Number(item.dueWeekday)<=6 ? Number(item.dueWeekday) : 5,
        appearTime:/^\d{2}:\d{2}$/.test(item.appearTime||"") ? item.appearTime : "08:00",
        dueTime:/^\d{2}:\d{2}$/.test(item.dueTime||"") ? item.dueTime : "23:59"
    }));
    target.clothesM = target.clothesM.filter(item=>item && typeof item==="object");
    target.clothesF = target.clothesF.filter(item=>item && typeof item==="object");
    target.layouts = target.layouts.filter(item=>item && typeof item==="object");
    target.backgrounds = target.backgrounds.filter(item=>item && typeof item==="object");
    target.coopTasks = target.coopTasks.filter(task=>task && typeof task==="object").map(task=>({
        ...task,
        completedBy:Array.isArray(task.completedBy)?task.completedBy:[],
        claimed:task.claimed===true,
        startAt:Number.isFinite(Number(task.startAt))?Number(task.startAt):null,
        dueAt:Number.isFinite(Number(task.dueAt))?Number(task.dueAt):null
    }));
    target.coopTaskTemplates = target.coopTaskTemplates.filter(item=>item && typeof item==="object").map(item=>({
        ...item,
        enabled:item.enabled!==false,
        scheduleType:item.scheduleType==="weekly"?"weekly":"daily",
        appearWeekday:Number.isInteger(Number(item.appearWeekday)) && Number(item.appearWeekday)>=0 && Number(item.appearWeekday)<=6 ? Number(item.appearWeekday) : 1,
        dueWeekday:Number.isInteger(Number(item.dueWeekday)) && Number(item.dueWeekday)>=0 && Number(item.dueWeekday)<=6 ? Number(item.dueWeekday) : 5,
        appearTime:/^\d{2}:\d{2}$/.test(item.appearTime||"") ? item.appearTime : "08:00",
        dueTime:/^\d{2}:\d{2}$/.test(item.dueTime||"") ? item.dueTime : "23:59"
    }));
    target.tasks = target.tasks.filter(task=>task && typeof task==="object");
    if(typeof target.globalBgImage!=="string") target.globalBgImage="";
    [...target.clothesM,...target.clothesF,...target.layouts,...target.backgrounds].forEach(item=>{
        if(!item.level) item.level = "R";
        if(typeof item.active!=="boolean") item.active = true;
        item.price = priceForLevel(item.level);
    });
    target.students.forEach((s,index)=>{
        if(!Number.isFinite(Number(s.id))) s.id=index+1;
        if(!s.gender) s.gender = s.id<=12?"M":"F";
        if(!Number.isFinite(Number(s.tokens))) s.tokens=0;
        else s.tokens=Number(s.tokens);
        if(!Number.isFinite(Number(s.lotteryTickets))) s.lotteryTickets = 0;
        else s.lotteryTickets = Math.max(0,Number(s.lotteryTickets));
        if(!Number.isFinite(Number(s.petAffection))) s.petAffection = 0;
        else s.petAffection = Math.max(0,Math.floor(Number(s.petAffection)));
        if(typeof s.lastPetMoodDate!=="string") s.lastPetMoodDate="";
        if(!Array.isArray(s.equippedLayout)) s.equippedLayout = [];
        if(s.equippedLayout.length>1) s.equippedLayout = s.equippedLayout.slice(-1);
        if(!Array.isArray(s.ownedClothes)) s.ownedClothes = [];
        if(!Array.isArray(s.ownedLayout)) s.ownedLayout = [];
        if(!Array.isArray(s.ownedBg)) s.ownedBg = [];
        if(!Array.isArray(s.doneTasks)) s.doneTasks = [];
        if(typeof s.equippedClothes==="undefined") s.equippedClothes=null;
        if(typeof s.equippedBg==="undefined") s.equippedBg=null;
    });
    return target;
}

function readSharedState(){
    const prefix = "#game=";
    if(!location.hash.startsWith(prefix)) return null;
    try{
        const data = JSON.parse(decodeURIComponent(location.hash.slice(prefix.length)));
        history.replaceState(null,"",location.pathname+location.search);
        return data;
    }catch(error){
        console.warn("分享資料無法讀取", error);
        return null;
    }
}

async function shareGame(){
    try{
        save();
        const encoded = encodeURIComponent(JSON.stringify(state));
        const url = `${location.origin}${location.pathname}#game=${encoded}`;
        const shareData = {title:"班級換裝遊戲",text:"一起加入班級換裝遊戲！",url};
        const canUseNativeShare = typeof navigator.share === "function" &&
            window.isSecureContext && location.protocol !== "file:";

        if(canUseNativeShare){
            try{
                await navigator.share(shareData);
                return;
            }catch(error){
                if(error.name === "AbortError") return;
                console.warn("原生分享被拒絕，改用複製連結",error);
            }
        }

        if(navigator.clipboard && window.isSecureContext){
            await navigator.clipboard.writeText(url);
            alert("原生分享未獲得瀏覽器許可，分享連結已複製！");
            return;
        }

        const copyBox = document.createElement("textarea");
        copyBox.value = url;

async function compressImage(file, maxSize, quality){
    return new Promise((resolve,reject)=>{
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = ()=>{
            URL.revokeObjectURL(url);
            let w = img.width, h = img.height;
            if(w>maxSize || h>maxSize){
                const scale = maxSize / Math.max(w,h);
                w = Math.round(w*scale);
                h = Math.round(h*scale);
            }
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0,0,w,h);
            ctx.drawImage(img,0,0,w,h);
            if(file.type==="image/png" || file.name.toLowerCase().endsWith(".png")){
                resolve(canvas.toDataURL("image/png"));
            }else{
                resolve(canvas.toDataURL("image/jpeg", quality));
            }
        };
        img.onerror = ()=>{
            URL.revokeObjectURL(url);
            reject(new Error("圖片解碼失敗"));
        };
        img.src = url;
    });
}

        const status = document.getElementById("saveStatus");
        status.textContent = window.firebaseGameStore.available ? "☁️ 正在同步..." : "💾 已儲存於本機";

function applyCloudState(cloudState){
    if(!cloudState || !Array.isArray(cloudState.students) || !cloudState.students.length) return false;
    const previousState = state;
    try{
        const candidate = normalizeState(structuredClone(cloudState));
        if(!candidate || !candidate.students.length) return false;
        state = candidate;
        render();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        unsavedChange = false;
        return true;
    }catch(error){
        state = previousState;
        console.error("雲端資料格式錯誤，繼續使用本機存檔",error);
        try{ render(); }catch(renderError){ console.error("恢復本機畫面失敗",renderError); }
        return false;
    }
}

];
let drawingContext = null;

let drawingUndoStack = [];

function drawingHistoryHtml(){

function initializeDrawingCanvas(){
    const canvas = document.getElementById("drawingCanvas");
    if(!canvas) return;
    drawingContext = canvas.getContext("2d",{alpha:false});
    drawingContext.fillStyle = "#ffffff";
    drawingContext.fillRect(0,0,canvas.width,canvas.height);
    drawingContext.lineCap = "round";
    drawingContext.lineJoin = "round";
    drawingTool = "pen";
    drawingColor = DRAWING_COLORS[0];
    drawingUndoStack = [];
    updateDrawingUndoButton();
    const point = event=>{
        const rect = canvas.getBoundingClientRect();
        return {
            x:(event.clientX-rect.left)*canvas.width/rect.width,
            y:(event.clientY-rect.top)*canvas.height/rect.height
        };
    };
    canvas.addEventListener("pointerdown",event=>{
        event.preventDefault();
        const p = point(event);
        if(drawingTool==="bucket"){
            floodFillDrawing(Math.floor(p.x),Math.floor(p.y));
            return;
        }
        pushDrawingUndoState();
        drawingActive = true;
        canvas.setPointerCapture(event.pointerId);
        drawingContext.beginPath();
        drawingContext.moveTo(p.x,p.y);
        drawingContext.lineTo(p.x+.01,p.y+.01);
        applyDrawingStroke();
        drawingContext.stroke();
    });
    canvas.addEventListener("pointermove",event=>{
        if(!drawingActive) return;
        event.preventDefault();
        const p = point(event);
        drawingContext.lineTo(p.x,p.y);
        applyDrawingStroke();
        drawingContext.stroke();
    });
    const stop=()=>{ drawingActive=false; drawingContext?.closePath(); };
    canvas.addEventListener("pointerup",stop);
    canvas.addEventListener("pointercancel",stop);
}

function updateDrawingUndoButton(){
    const button = document.getElementById("drawingUndo");
    if(!button) return;
    button.disabled = drawingUndoStack.length===0;
    button.textContent = `返回上一步（${drawingUndoStack.length}/5）`;
}
function pushDrawingUndoState(){
    const canvas = document.getElementById("drawingCanvas");
    if(!canvas || !drawingContext) return;
    drawingUndoStack.push(drawingContext.getImageData(0,0,canvas.width,canvas.height));
    if(drawingUndoStack.length>5) drawingUndoStack.shift();
    updateDrawingUndoButton();
}
function undoDrawing(){
    if(!drawingContext || !drawingUndoStack.length) return;
    drawingContext.putImageData(drawingUndoStack.pop(),0,0);
    updateDrawingUndoButton();
    const status = document.getElementById("drawingStatus");
    if(status) status.textContent = "已返回上一步";
}
function applyDrawingStroke(){
    if(!drawingContext) return;
    drawingContext.strokeStyle = drawingTool==="eraser" ? "#ffffff" : drawingColor;
    drawingContext.lineWidth = drawingTool==="eraser" ? 30 : 7;
}
function selectDrawingColor(color,button){
    drawingColor = color;
    if(drawingTool!=="bucket") drawingTool = "pen";
    document.querySelectorAll(".drawing-color").forEach(item=>item.classList.toggle("selected",item===button));
    document.getElementById("drawingEraser")?.classList.remove("active");
}
function toggleDrawingEraser(){
    drawingTool = drawingTool==="eraser" ? "pen" : "eraser";
    document.getElementById("drawingEraser")?.classList.toggle("active",drawingTool==="eraser");
    document.getElementById("drawingBucket")?.classList.remove("active");
}
function toggleDrawingBucket(){
    drawingTool = drawingTool==="bucket" ? "pen" : "bucket";
    document.getElementById("drawingBucket")?.classList.toggle("active",drawingTool==="bucket");
    document.getElementById("drawingEraser")?.classList.remove("active");

    if(status) status.textContent = drawingTool==="bucket" ? "油漆桶已啟用，點選封閉區域填色" : "畫筆已啟用";
}
function drawingHexToRgba(hex){
    const value = hex.replace("#","");
    const normalized = value.length===3 ? value.split("").map(char=>char+char).join("") : value;
    return [parseInt(normalized.slice(0,2),16),parseInt(normalized.slice(2,4),16),parseInt(normalized.slice(4,6),16),255];
}
function floodFillDrawing(startX,startY){
    const canvas = document.getElementById("drawingCanvas");
    if(!canvas || !drawingContext || startX<0 || startY<0 || startX>=canvas.width || startY>=canvas.height) return false;
    const image = drawingContext.getImageData(0,0,canvas.width,canvas.height);
    const data = image.data;
    const startIndex = (startY*canvas.width+startX)*4;
    const target = [data[startIndex],data[startIndex+1],data[startIndex+2],data[startIndex+3]];
    const fill = drawingHexToRgba(drawingColor);
    if(target.every((value,index)=>value===fill[index])) return false;
    pushDrawingUndoState();
    const queue = new Int32Array(canvas.width*canvas.height);
    let head = 0;
    let tail = 0;
    const matches = index=>data[index]===target[0] && data[index+1]===target[1] && data[index+2]===target[2] && data[index+3]===target[3];
    const colorPixel = index=>{
        data[index]=fill[0]; data[index+1]=fill[1]; data[index+2]=fill[2]; data[index+3]=fill[3];
    };
    queue[tail++]=startY*canvas.width+startX;
    colorPixel(startIndex);
    while(head<tail){
        const pixel=queue[head++];
        const x=pixel%canvas.width;
        const y=Math.floor(pixel/canvas.width);
        const neighbors=[];
        if(x>0) neighbors.push(pixel-1);
        if(x<canvas.width-1) neighbors.push(pixel+1);
        if(y>0) neighbors.push(pixel-canvas.width);
        if(y<canvas.height-1) neighbors.push(pixel+canvas.width);
        neighbors.forEach(next=>{
            const index=next*4;
            if(!matches(index)) return;
            colorPixel(index);
            queue[tail++]=next;
        });
    }
    drawingContext.putImageData(image,0,0);
    const status = document.getElementById("drawingStatus");
    if(status) status.textContent = "區域填色完成";
    return true;
}
function clearDrawingBoard(){
    const canvas = document.getElementById("drawingCanvas");
    if(!canvas || !drawingContext || !confirm("確定清空目前畫板？")) return;
    pushDrawingUndoState();
    drawingContext.fillStyle = "#ffffff";
    drawingContext.fillRect(0,0,canvas.width,canvas.height);
    document.getElementById("drawingStatus").textContent = "畫板已清空";
}
function saveDrawingBoard(){
    const canvas = document.getElementById("drawingCanvas");
    if(!canvas) return;
    const item = {id:"drawing_"+Date.now(),savedAt:new Date().toISOString(),data:canvas.toDataURL("image/jpeg",.78)};
    state.drawings.unshift(item);
    if(state.drawings.length>3){
        state.drawingAlbum.unshift(...state.drawings.splice(3));
    }
    markChanged();

//排程任務：每日依日期、每週依週一日期去重；截止不晚於出現時間時延至下一週期。
const WEEKDAY_NAMES = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function localDateKey(date=new Date()){
    const year = date.getFullYear();
    const month = String(date.getMonth()+1).padStart(2,"0");
    const day = String(date.getDate()).padStart(2,"0");
    return `${year}-${month}-${day}`;
}
function dateAtLocalTime(dateKey,time){
    const [year,month,day] = dateKey.split("-").map(Number);
    const [hour,minute] = time.split(":").map(Number);
    return new Date(year,month-1,day,hour,minute,0,0);
}
function localWeekStart(date=new Date()){
    const start = new Date(date.getFullYear(),date.getMonth(),date.getDate());
    start.setDate(start.getDate()-((start.getDay()+6)%7));
    return start;
}
function dateInWeek(weekStart,weekday,time){
    const result = new Date(weekStart);
    const [hour,minute] = time.split(":").map(Number);
    result.setDate(result.getDate()+((Number(weekday)+6)%7));
    result.setHours(hour,minute,0,0);
    return result;
}
function generateDailyTasks(now=new Date()){
    const today = localDateKey(now);
    let changed = false;
    state.dailyTaskTemplates.forEach(template=>{
        if(template.enabled===false || !template.title) return;
        const appearAt = dateAtLocalTime(today,template.appearTime);
        if(now < appearAt) return;
        const taskId = `daily_${template.id}_${today}`;
        if(state.tasks.some(task=>task.id===taskId)) return;
        let dueAt = dateAtLocalTime(today,template.dueTime);
        if(dueAt<=appearAt) dueAt.setDate(dueAt.getDate()+1);
        state.tasks.push({
            id:taskId,
            title:template.title,
            reward:Number(template.reward)||0,
            dueAt:dueAt.getTime(),
            dailyTemplateId:template.id,
            dailyDate:today
        });
        changed = true;
    });
    return changed;
}
function generateWeeklyTasks(now=new Date()){
    const weekStart = localWeekStart(now);
    const weekKey = localDateKey(weekStart);
    let changed = false;
    state.weeklyTaskTemplates.forEach(template=>{
        if(template.enabled===false || !template.title) return;
        const appearAt = dateInWeek(weekStart,template.appearWeekday,template.appearTime);
        if(now < appearAt) return;
        const taskId = `weekly_${template.id}_${weekKey}`;
        if(state.tasks.some(task=>task.id===taskId)) return;
        const dueAt = dateInWeek(weekStart,template.dueWeekday,template.dueTime);
        if(dueAt<=appearAt) dueAt.setDate(dueAt.getDate()+7);
        state.tasks.push({
            id:taskId,
            title:template.title,
            reward:Number(template.reward)||0,
            dueAt:dueAt.getTime(),
            weeklyTemplateId:template.id,
            weeklyDate:weekKey
        });
        changed = true;
    });
    return changed;
}
function coopTaskFromTemplate(template,id,startAt,dueAt){
    return {
        id,
        monsterName:template.monsterName,
        content:template.content,
        reward:Number(template.reward)||0,
        rewardType:template.rewardType==="ticket"?"ticket":"token",
        monsterImage:template.monsterImage||"",
        completedBy:[],
        claimed:false,
        startAt:startAt.getTime(),
        dueAt:dueAt.getTime(),
        coopTemplateId:template.id
    };
}
function generateScheduledCoopTasks(now=new Date()){
    let changed = false;
    state.coopTaskTemplates.forEach(template=>{
        if(template.enabled===false || !template.monsterName || !template.content) return;
        if(template.scheduleType==="weekly"){
            const weekStart = localWeekStart(now);
            const weekKey = localDateKey(weekStart);
            const startAt = dateInWeek(weekStart,template.appearWeekday,template.appearTime);
            if(now<startAt) return;
            const id = `coop_weekly_${template.id}_${weekKey}`;
            if(state.coopTasks.some(task=>task.id===id)) return;
            const dueAt = dateInWeek(weekStart,template.dueWeekday,template.dueTime);
            if(dueAt<=startAt) dueAt.setDate(dueAt.getDate()+7);
            state.coopTasks.push(coopTaskFromTemplate(template,id,startAt,dueAt));
            changed = true;
            return;
        }
        const today = localDateKey(now);
        const startAt = dateAtLocalTime(today,template.appearTime);
        if(now<startAt) return;
        const id = `coop_daily_${template.id}_${today}`;
        if(state.coopTasks.some(task=>task.id===id)) return;
        const dueAt = dateAtLocalTime(today,template.dueTime);
        if(dueAt<=startAt) dueAt.setDate(dueAt.getDate()+1);
        state.coopTasks.push(coopTaskFromTemplate(template,id,startAt,dueAt));
        changed = true;
    });
    return changed;
}
function syncScheduledTasks(){
    const changed = generateDailyTasks() | generateWeeklyTasks() | generateScheduledCoopTasks();
    if(!changed) return false;
    markChanged();
    save();
    render();
    return true;
}
function syncDailyTasks(){
    return syncScheduledTasks();
}

function openCoopTask(taskId, taskButtons=""){
    const task = state.coopTasks.find(t=>t.id===taskId);
    if(!task) return openCoopTasks();
    const completed = Array.isArray(task.completedBy) ? task.completedBy : [];
    const hpPercent = Math.max(0, Math.round((state.students.length-completed.length) / state.students.length * 100));
    const members = state.students.map(s=>{
        const done = completed.includes(s.id);
        const pool = s.gender==="M" ? state.clothesM : state.clothesF;
        const equipped = pool.find(x=>x.id===s.equippedClothes);
        const eqBg = state.backgrounds.find(x=>x.id===s.equippedBg);
        const image = equipped?.image || (s.gender==="M" ? "/images/boy/b0.png" : "/images/girl/g0.png");
        const bgImage = eqBg?.image || "";
        const bgHtml = bgImage ? `<div class="bg-layer" style="background-image:url('${esc(bgImage)}')"></div>` : "";
        return `<button class="coop-member ${done?"done":""}" ${done?"disabled":""} onclick="completeCoopMember('${esc(task.id)}',${s.id})">
            <div class="coop-avatar"><div class="avatar">${bgHtml}<div class="character" style="background-image:url('${esc(image)}')"></div></div></div>
            <span>${s.id}${done?" ✓":""}</span>
        </button>`;
    }).join("");
    openModal(`<h2>協力任務</h2>
        <div class="monster-list">${taskButtons}</div>
        <div class="coop-layout">
            <div class="coop-side coop-side-monster">
                <div class="coop-monster-image-box" id="coopMonsterVisual">${task.monsterImage?`<img src="${esc(task.monsterImage)}" alt="${esc(task.monsterName)}">`:`<span style="font-size:64px">👾</span>`}</div>
                <div class="coop-monster-info">
                    <h3>${esc(task.monsterName)}</h3>
                    <div class="coop-hp" aria-label="怪獸HP"><div class="coop-hp-fill" style="width:${hpPercent}%"></div></div>
                    <b>HP ${state.students.length-completed.length} / ${state.students.length}</b>
                    <div>${esc(task.content)}</div>
                    <div class="small">全員完成後，每位成員獲得 🪙/🎟️</div>
                </div>
            </div>
            <div class="coop-side coop-side-members">
                <div class="coop-members">${members}</div>
            </div>
        </div>`);
}
function completeCoopMember(taskId,studentId){
    const task = state.coopTasks.find(t=>t.id===taskId);
    const now = Date.now();
    if(!task || task.claimed || (task.startAt && now<task.startAt) || (task.dueAt && now>task.dueAt)) return;
    if(!Array.isArray(task.completedBy)) task.completedBy=[];
    if(task.completedBy.includes(studentId)) return;
    task.completedBy.push(studentId);
    if(task.completedBy.length >= state.students.length){
        const reward = Number(task.reward)||0;
        const rewardType = task.rewardType==="ticket" ? "ticket" : "token";
        state.students.forEach(s=>{
            if(rewardType==="ticket") s.lotteryTickets = (s.lotteryTickets||0) + reward;
            else s.tokens += reward;
        });
        task.claimed = true;
        markChanged(); save(); render();
        alert(`恭喜同心協力打敗「${task.monsterName}」！每位成員獲得 ${reward} ${rewardType==="ticket"?"張樂透券":"代幣"}！`);
        openCoopTasks();
        return;
    }
    markChanged(); save();
    const active = activeCoopTasks();
    const taskButtons = active.map(t=>`<button class="${t.id===taskId?"active":""}" onclick="openCoopTasks('${esc(t.id)}')">${esc(t.monsterName)}</button>`).join("");
    openCoopTask(taskId, taskButtons);
    setTimeout(()=>document.getElementById("coopMonsterVisual")?.classList.add("coop-hit"),20);
}

function drawLottery(id){
    const s = state.students[id-1];
    if(!s || (s.lotteryTickets||0)<1) return alert("樂透券不足！");
    const clothPool = (s.gender==="M" ? state.clothesM : state.clothesF).filter(item=>item.active!==false);
    const prizes = [
        ...clothPool.map(item=>({item,type:"clothes"})),
        ...state.layouts.filter(item=>item.active!==false).map(item=>({item,type:"layout"})),
        ...state.backgrounds.filter(item=>item.active!==false).map(item=>({item,type:"background"}))
    ];
    if(!prizes.length) return alert("商店目前沒有可抽取的商品！");
    const roll = Math.random()*100;
    const wantedLevel = roll<80 ? "R" : roll<95 ? "SR" : roll<99 ? "SSR" : "UR";
    const levelPrizes = prizes.filter(prize=>(prize.item.level||"R")===wantedLevel);
    const pool = levelPrizes.length ? levelPrizes : prizes;
    const prize = pool[Math.floor(Math.random()*pool.length)];
    s.lotteryTickets -= 1;
    const addedToWardrobe = addItemToWardrobe(s,prize.type,prize.item.id);
    const duplicate = !addedToWardrobe;
    if(duplicate) s.tokens += 20;
    markChanged(); save(); render();
    const machine = document.getElementById("gachaMachine");
    machine?.classList.add("drawing");
    const resultMessage = duplicate
        ? `抽中 ${prize.item.level||"R"}｜${prize.item.name}，已擁有此商品，返還 20 代幣！`
        : `恭喜抽中 ${prize.item.level||"R"}｜${prize.item.name}！`;
    setTimeout(()=>{
        machine?.classList.remove("drawing");
        showLotteryResult(prize.item,resultMessage);
    },850);
    const ticketTitle = document.querySelector(".lottery-page h3");
    if(ticketTitle) ticketTitle.textContent = `持有樂透券：🎟️ ${s.lotteryTickets}`;
    const drawButton = document.querySelector(".lottery-page > button");
    if(drawButton) drawButton.disabled = s.lotteryTickets<1;
}
function showLotteryResult(item,message){

function groupedClosetCards(list,card,emptyText){
    if(!list.length) return `<div class="empty">${emptyText}</div>`;
    return LEVEL_ORDER.map(level=>{
        const items = list.filter(item=>(item.level||"R")===level);
        return items.length ? `<section class="shop-level level-${level.toLowerCase()}">
            <div class="shop-level-header"><h3><span class="level-badge">${level}</span>${level} 等級</h3><span>${items.length} 件</span></div>
            <div class="shopgrid">${items.map(card).join("")}</div>
        </section>` : "";
    }).join("");
}
function switchClosetTab(id,tab){
    const s = state.students[id-1];
    const clothPool = s.gender==="M"?state.clothesM:state.clothesF;
    let html="";
    if(tab==="clothes"){
        const list = clothPool.filter(x=>s.ownedClothes.includes(x.id));
        html = groupedClosetCards(list,p=>`<div class="product">
            <div class="pic">${p.image?`<img src="${esc(p.image)}">`:"👗"}</div>
            <b>${esc(p.name)}</b>
            <div><button onclick="equipClothes(${id},'${esc(p.id)}')">${s.equippedClothes===p.id?"脫下":"穿上"}</button></div>
        </div>`,"還沒有服裝");
    }
    if(tab==="layouts"){
        const list = state.layouts.filter(x=>s.ownedLayout.includes(x.id));
        const defaultPetCard = `<section class="shop-level level-r">
            <div class="shop-level-header"><h3>預設寵物</h3><span>永久擁有</span></div>
            <div class="shopgrid">
                <div class="product">
                    <div class="pic"><img src="${esc(DEFAULT_PET_IMAGE)}" alt="${esc(DEFAULT_PET_NAME)}"></div>
                    <b>${esc(DEFAULT_PET_NAME)}</b>
                    <div><button onclick="equipDefaultPet(${id})" ${s.equippedLayout.length===0?"disabled":""}>${s.equippedLayout.length===0?"使用中":"使用"}</button></div>
                </div>
            </div>
        </section>`;
        html = defaultPetCard + groupedClosetCards(list,p=>`<div class="product">
            <div class="pic">${p.image?`<img src="${esc(p.image)}">`:"🐾"}</div>
            <b>${esc(p.name)}</b>
            <div><button onclick="toggleEquipLayout(${id},'${esc(p.id)}')">${s.equippedLayout.includes(p.id)?"卸下":"穿上"}</button></div>
        </div>`,"還沒有其他寵物");
    }
    if(tab==="bgs"){
        const list = state.backgrounds.filter(x=>s.ownedBg.includes(x.id));
        html = groupedClosetCards(list,p=>`<div class="product">
            <div class="pic">${p.image?`<img src="${esc(p.image)}">`:"🖼"}</div>
            <b>${esc(p.name)}</b>
            <div><button onclick="equipBg(${id},'${esc(p.id)}')">${s.equippedBg===p.id?"移除":"設為背景"}</button></div>
        </div>`,"還沒有背景");
    }
    document.getElementById("closetTabContent").innerHTML = html;
    document.getElementById("closetPreview").innerHTML = closetPreviewHtml(id);
    document.querySelectorAll("#modal .tabs .tab").forEach((el,i)=>{
        el.classList.toggle("active", ["clothes","layouts","bgs"][i]===tab);
    });
}
function equipClothes(id,pid){
    const s = state.students[id-1];

function backendPageId(listName){
    return {
        clothesM:"backend-clothes-m",

        backgrounds:"backend-backgrounds"
    }[listName] || "backend-overview";

//商品排序：調整陣列順序，商店會依此順序顯示
let draggedItem = null;
function dragItem(event,listName,id){
    draggedItem = {listName,id};
    event.dataTransfer.effectAllowed = "move";
    event.dataTransfer.setData("text/plain", id);
}
function dropItem(event,listName,targetId){
    event.preventDefault();
    if(!draggedItem || draggedItem.listName!==listName || draggedItem.id===targetId) return;
    const list = state[listName];
    const fromIndex = list.findIndex(item=>item.id===draggedItem.id);
    const toIndex = list.findIndex(item=>item.id===targetId);
    if(fromIndex<0 || toIndex<0) return;
    const [item] = list.splice(fromIndex,1);
    list.splice(toIndex,0,item);
    draggedItem = null;
    markChanged(); save(); refreshBackendPage(backendPageId(listName));
}
function activateBackendPage(targetId,shouldScroll=false){
    document.querySelectorAll(".backend-page").forEach(page=>page.classList.remove("active"));
    const target = document.getElementById(targetId);
    if(!target) return;
    target.classList.add("active");
    if(shouldScroll){
        target.scrollIntoView({behavior:"smooth",block:"start"});
    }
}
function jumpBackend(targetId){
    activateBackendPage(targetId,true);
}
function refreshBackendPage(targetId){
    const panel = document.querySelector("#modal .panel");
    const savedScrollTop = panel ? panel.scrollTop : 0;
    return backend().then(()=>{
        activateBackendPage(targetId,false);
        const refreshedPanel = document.querySelector("#modal .panel");
        if(!refreshedPanel) return;
        refreshedPanel.scrollTop = savedScrollTop;
        requestAnimationFrame(()=>{
            refreshedPanel.scrollTop = savedScrollTop;
        });
    });
}

async function publishCoopTask(){
    const monsterName = document.getElementById("coopMonsterName").value.trim();
    const content = document.getElementById("coopContent").value.trim();
    const reward = Number(document.getElementById("coopReward").value);
    const rewardType = document.getElementById("coopRewardType").value;
    const monsterImage = document.getElementById("coopMonsterImage").value;
    const scheduleType = document.getElementById("coopScheduleType").value;
    if(!monsterName || !content || !Number.isFinite(reward) || reward<0) return alert("請完整填寫怪獸名稱、任務內容與獎勵");
    if(scheduleType==="once"){
        const startValue = document.getElementById("coopStartAt").value;
        const dueValue = document.getElementById("coopDueAt").value;
        const startAt = startValue?new Date(startValue).getTime():Date.now();
        const dueAt = dueValue?new Date(dueValue).getTime():null;
        if(dueAt && dueAt<=startAt) return alert("協力任務截止時間必須晚於開始時間");
        state.coopTasks.push({id:makeTaskId(),monsterName,content,reward,rewardType,monsterImage,completedBy:[],claimed:false,startAt,dueAt});
    }else if(scheduleType==="daily"){
        const appearTime=document.getElementById("coopDailyAppearTime").value;
        const dueTime=document.getElementById("coopDailyDueTime").value;
        if(!appearTime||!dueTime) return alert("請完整填寫每日出現與截止時間");
        state.coopTaskTemplates.push({id:"coop_template_"+Date.now(),monsterName,content,reward,rewardType,monsterImage,scheduleType,appearTime,dueTime,enabled:true});
        generateScheduledCoopTasks();
    }else{
        const appearWeekday=Number(document.getElementById("coopWeeklyAppearWeekday").value);
        const appearTime=document.getElementById("coopWeeklyAppearTime").value;
        const dueWeekday=Number(document.getElementById("coopWeeklyDueWeekday").value);
        const dueTime=document.getElementById("coopWeeklyDueTime").value;
        if(!appearTime||!dueTime) return alert("請完整填寫每週出現與截止時間");
        state.coopTaskTemplates.push({id:"coop_template_"+Date.now(),monsterName,content,reward,rewardType,monsterImage,scheduleType,appearWeekday,appearTime,dueWeekday,dueTime,enabled:true});
        generateScheduledCoopTasks();
    }
    markChanged(); save(); render(); refreshBackendPage("backend-coop");
}

async function importData(input){
    const f = input.files[0];
    if(!f) return;
    const txt = await f.text();
    try{
        const newState = JSON.parse(txt);
        if(!newState.students) throw new Error("檔案不是有效的備份");
        if(!confirm("⚠️ 將覆蓋目前所有資料！建議先匯出備份！確定嗎？")) return;
        state = normalizeState(newState);
        markChanged(); save(); render(); backend();
        alert("匯入成功！");
    }catch(e){
        alert("匯入失敗："+e.message);

}

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { getDatabase, get, onValue, ref, remove, set } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCqaX7A6gCTSOo9NBrdb2KizOHFo9dVEJo",
    authDomain: "classroom-115.firebaseapp.com",
    databaseURL: "https://classroom-115-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "classroom-115",
    storageBucket: "classroom-115.firebasestorage.app",
    messagingSenderId: "242136273912",
    appId: "1:242136273912:web:8bd1b43dc7d8ecc698fc0d"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const database = getDatabase(app);
  const gameRef = ref(database, CLOUD_SAVE_PATH);
  const status = document.getElementById("saveStatus");
  let cloudReady = false;
  let applyingRemote = false;
  let pendingState = null;
  let saveInFlight = null;

  function savedAt(value){
    const time = Date.parse(value?.lastSaved || "");
    return Number.isFinite(time) ? time : 0;
  }

  function cloneState(value){
    return typeof structuredClone === "function"
      ? structuredClone(value)
      : JSON.parse(JSON.stringify(value));
  }

  function showCloudError(error){
    console.error("Firebase 同步失敗", error);
    status.textContent = "⚠️ 雲端同步失敗（保留本機存檔）";
  }

  async function flushCloudSave(){
    if(!cloudReady || applyingRemote || saveInFlight || !pendingState) return saveInFlight || false;
    const snapshotToSave = pendingState;
    pendingState = null;
    saveInFlight = set(gameRef, snapshotToSave)
      .then(()=>{
        status.textContent = `☁️ 已同步 ${new Date().toLocaleTimeString()}`;
        return true;
      })
      .catch(error=>{
        // 保留最新版本供連線恢復或離開頁面前再次重試。
        if(!pendingState || savedAt(snapshotToSave) > savedAt(pendingState)) pendingState = snapshotToSave;
        showCloudError(error);
        return false;
      })
      .finally(()=>{
        saveInFlight = null;
        if(pendingState) void flushCloudSave();
      });
    return saveInFlight;
  }

  window.firebaseGameStore = {
    available:true,
    queueSave(nextState){
      if(applyingRemote) return;
      pendingState = cloneState(nextState);
      if(cloudReady) void flushCloudSave();
    },
    flush(){ return flushCloudSave(); },
    hasPendingSave(){ return Boolean(pendingState || saveInFlight); },
    remove(){
      pendingState = null;
      return remove(gameRef);
    }
  };

  try{
    await signInAnonymously(auth);
    const initialSnapshot = await get(gameRef);
    let catalogChanged = false;
    if(initialSnapshot.exists()){
      const remoteState = initialSnapshot.val();
      // 本機可能是在 Firebase 尚未初始化時先完成的操作；較新的本機資料不可被舊雲端覆蓋。
      if(savedAt(state) > savedAt(remoteState)){
        pendingState = cloneState(state);
        status.textContent = "☁️ 正在補傳較新的本機進度...";
      }else{
        applyingRemote = true;
        const loaded = applyCloudState(remoteState);
        if(loaded) catalogChanged = reconcileBuiltinCatalog();
        applyingRemote = false;
        status.textContent = loaded ? "☁️ 已載入雲端進度" : "💾 雲端資料異常，使用本機存檔";
      }
    }else{
      pendingState = cloneState(state);
      status.textContent = "☁️ 正在建立雲端存檔...";
    }
    cloudReady = true;
    if(catalogChanged) pendingState = cloneState(state);
    await flushCloudSave();

    onValue(gameRef, snapshot=>{
      if(!cloudReady || !snapshot.exists()) return;
      let shouldSyncCatalog = false;
      try{
        const remoteState = snapshot.val();
        // 忽略自己的寫入、舊版本，以及本機仍有待送資料時收到的遠端事件。
        if(remoteState?.lastSaved === state.lastSaved ||
           savedAt(remoteState) <= savedAt(state) ||
           window.firebaseGameStore.hasPendingSave()) return;
        applyingRemote = true;
        if(applyCloudState(remoteState)){
          shouldSyncCatalog = reconcileBuiltinCatalog();
          status.textContent = "☁️ 已取得最新進度";
        }else{
          status.textContent = "💾 雲端資料異常，使用本機存檔";
        }
      }catch(error){
        showCloudError(error);
      }finally{
        applyingRemote = false;
      }
      if(shouldSyncCatalog) window.firebaseGameStore.queueSave(state);
    }, showCloudError);
  }catch(error){
    window.firebaseGameStore.available = false;
    showCloudError(error);
  }
</script>
