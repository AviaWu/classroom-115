name: Test and deploy Firebase rules and Hosting
concurrency:
  group: firebase-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global firebase-tools@15.30.0
      - name: Validate database rules against emulator
        run: firebase emulators:exec --config firebase.emulator.json --project demo-classroom-sync --only database "npm run test:emulator"
      - name: Deploy rules before allowing new clients
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLASSROOM_115 }}
        run: |
          set -euo pipefail
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$credentials"' EXIT
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials"
          node -e 'const fs = require("fs"); const account = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, "utf8")); if (account.type !== "service_account" || !account.client_email || !account.private_key) throw new Error("Invalid Firebase service account secret"); console.log("Deploying as: " + account.client_email); console.log("Credential project: " + account.project_id);'
          if ! firebase database:instances:list --project classroom-115 --non-interactive; then
            echo "::error::Cannot list Realtime Database instances. Check the deployment service account's Firebase Realtime Database Admin role in project classroom-115, API availability, and organization policies. See docs/cloud-sync-deployment.md. Hosting has NOT been deployed."
            exit 1
          fi
          if ! firebase deploy --only database --project classroom-115 --non-interactive; then
            echo "::error::Database rules deployment failed. Confirm classroom-115-default-rtdb exists in project classroom-115 and that the deployment account has Firebase Realtime Database Admin permissions. Do not bypass this step to deploy Hosting."
            exit 1
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLASSROOM_115 }}
          channelId: live
          projectId: classroom-115
