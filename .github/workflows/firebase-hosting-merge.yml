# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Test and deploy Firebase rules and Hosting
concurrency:
  group: firebase-production
  cancel-in-progress: false
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global firebase-tools@15.30.0
      - name: Validate database rules against emulator
        run: firebase emulators:exec --config firebase.emulator.json --project demo-classroom-sync --only database "node --test tests/database-rules.emulator.mjs"
      - name: Deploy rules before allowing new clients
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLASSROOM_115 }}
        run: |
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$credentials"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials"
          firebase deploy --only database --project classroom-115 --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLASSROOM_115 }}
          channelId: live
          projectId: classroom-115
